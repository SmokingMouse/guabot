[project]
name = "guabot"
version = "0.1.0"
description = "Guabot agent scaffold and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.27.0",
    "pydantic>=2.6.0",
    "openai>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"
